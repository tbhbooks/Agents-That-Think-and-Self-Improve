[book]
title = "The Builder's Handbook: Agents That Think and Self-Improve"
authors = ["TBH Books"]
description = "Learn how AI coding agents work — by building one from scratch."
language = "en"
multilingual = false
src = "src"

[output.html]
default-theme = "navy"
preferred-dark-theme = "navy"
git-repository-url = "https://github.com/tbhbooks/Agents-That-Think-and-Self-Improve"
edit-url-template = "https://github.com/tbhbooks/Agents-That-Think-and-Self-Improve/edit/main/{path}"
site-url = "/Agents-That-Think-and-Self-Improve/"
no-section-label = false
smart-punctuation = true
additional-js = ["mermaid.min.js", "mermaid-init.js"]

[output.html.fold]
enable = true
level = 1

[output.html.search]
enable = true
limit-results = 30
use-boolean-and = true
boost-title = 2
boost-hierarchy = 1
boost-paragraph = 1
expand = true
heading-split-level = 3

[preprocessor]

[preprocessor.mermaid]
command = "mdbook-mermaid"
